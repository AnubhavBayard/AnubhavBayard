name: Generate Snake Animation

on:
  schedule: # 03:00 UTC daily
    - cron: "0 3 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: Platane/snk@v3
        id: snake-gif
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/serpent.svg?color_snake=#a4161a&color_dots=#e3e3e3,#f0a6a6,#d33f4a,#a4161a,#6a040f
            dist/serpent-dark.svg?color_snake=#ff3b3b&color_dots=#1c1c1c,#5c0f14,#a4161a,#d33f4a,#ff3b3b

      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
