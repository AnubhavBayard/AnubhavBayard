<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 -48 560 110" width="560" height="110" role="img">
  <style>
    .fg   { fill: #14181d; }
    .red  { fill: #a4161a; }
    .ln   { stroke: #a4161a; }
    .rune { animation: breathe 6s ease-in-out infinite; }
    .rune2{ animation: breathe 6s ease-in-out infinite; animation-delay: 3s; }
    .glint{ animation: sweep 7s cubic-bezier(.4,0,.2,1) infinite; }
    .raven { fill: #ffffff; stroke: #14181d; stroke-width: .8; stroke-linejoin: round; }
    .rv-eye { fill: #a4161a; }
    .rv-leg { stroke: #14181d; stroke-width: 1.6; stroke-linecap: round; fill: none; }
    .rv-head, .rv-wing, .rv-tail, .rv-body, .rv-blink { transform-box: fill-box; }
    .rv-body  { transform-origin: 50% 100%; animation: rv-breathe 3.2s ease-in-out infinite; }
    .rv-head  { transform-origin: 80% 70%;  animation: rv-look 7s ease-in-out infinite; }
    .rv-blink { transform-origin: 50% 50%;  animation: rv-blink 4.6s steps(1) infinite; }
    .rv-wing  { transform-origin: 10% 10%;  animation: rv-ruffle 9s ease-in-out infinite; }
    .rv-tail  { transform-origin: 0% 0%;    animation: rv-flick 5.5s ease-in-out infinite; }
    @keyframes rv-breathe { 0%,100% { transform: scaleY(1) } 50% { transform: scaleY(1.035) } }
    @keyframes rv-look {
      0%,28%   { transform: rotate(0) }
      34%,44%  { transform: rotate(-14deg) }
      50%,62%  { transform: rotate(9deg) }
      68%,100% { transform: rotate(0) }
    }
    @keyframes rv-blink { 0%,95% { transform: scaleY(1) } 96%,99% { transform: scaleY(.1) } }
    @keyframes rv-ruffle {
      0%,78%   { transform: rotate(0) }
      81%      { transform: rotate(-16deg) }
      84%      { transform: rotate(-4deg) }
      87%      { transform: rotate(-13deg) }
      91%,100% { transform: rotate(0) }
    }
    @keyframes rv-flick { 0%,70%,100% { transform: rotate(0) } 76% { transform: rotate(9deg) } 82% { transform: rotate(-3deg) } }
    @keyframes breathe { 0%,100% { opacity: .45 } 50% { opacity: 1 } }
    @keyframes sweep {
      0%    { transform: translateX(-140px) }
      55%,100% { transform: translateX(600px) }
    }
    @media (prefers-color-scheme: dark) {
      .fg  { fill: #f2f2f2; }
      .red { fill: #ff3b3b; }
      .ln  { stroke: #ff3b3b; }
      .raven { fill: #ffffff; stroke: none; }
      .rv-eye { fill: #ff3b3b; stroke: none; }
      .rv-leg { stroke: #ffffff; }
    }
    @media (prefers-reduced-motion: reduce) {
      .rune, .rune2, .glint, .rv-body, .rv-head, .rv-blink, .rv-wing, .rv-tail { animation: none }
      .glint { opacity: 0 }
    }
  </style>
  <defs>
    <linearGradient id="gl" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#ff3b3b" stop-opacity="0"/>
      <stop offset="50%"  stop-color="#ff3b3b" stop-opacity=".95"/>
      <stop offset="100%" stop-color="#ff3b3b" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <g font-family="'JetBrains Mono','Fira Code','Cascadia Mono',Consolas,'DejaVu Sans Mono',monospace">

    <text class="red rune"  x="30"  y="30" font-size="21" text-anchor="middle">ᛏ</text>
    <text class="red rune2" x="530" y="30" font-size="21" text-anchor="middle">ᛏ</text>
    <text class="fg" x="280" y="31" font-size="21" font-weight="700" letter-spacing="4.5"
          text-anchor="middle">THE ARMOURY</text>
    <line class="ln" x1="60" y1="46" x2="500" y2="46" stroke-width="1.2" opacity=".35"/>
    <g clip-path="url(#clip)">
      <rect class="glint" x="0" y="43.4" width="140" height="5" fill="url(#gl)" rx="2.5"/>
    </g>
    <clipPath id="clip"><rect x="60" y="40" width="440" height="12"/></clipPath>

  </g>
  <!-- raven perched on the Y of THE ARMOURY -->
  <g transform="translate(367 15.5) scale(1.1)">
    <path class="rv-leg" d="M-1 -8 L-2 0 M-7 0 L1 0 M5 -8 L4 0 M-1 0 L7 0"/>
    <g class="rv-tail"><path class="raven" d="M16 -14 L35 -6 L33 -2.5 L29 -4 L27 -0.5 L13 -9 Z"/></g>
    <g class="rv-body">
      <path class="raven" d="M-12 -21 C-14 -29 -6 -34 2 -33 C12 -32 20 -25 24 -17 C26 -12 22 -9 16 -9 L-2 -8 C-8 -9 -12 -14 -12 -21 Z"/>
      <path class="raven" d="M-13 -23 L-16 -17 L-13 -18.5 L-14 -14 L-11 -16 L-10 -12 L-8 -16 Z"/>
      <g class="rv-wing"><path class="raven" d="M-5 -29 C6 -33 18 -27 24 -19 L38 -8 L33 -8.5 L35 -6 L22 -10.5 C12 -12 2 -14 -2 -20 C-4 -23 -5 -26 -5 -29 Z"/></g>
      <g class="rv-head">
        <path class="raven" d="M-5 -29 C-5 -37 -11 -41 -16 -40 C-20 -39.5 -22 -37 -22.5 -35 L-33 -31.5 C-33.5 -30.5 -33 -29.5 -32 -29.8 L-21.5 -27 C-19.5 -24 -16 -22 -12 -22 C-8 -22 -5 -25 -5 -29 Z"/>
        <g class="rv-blink"><circle class="rv-eye" cx="-15.5" cy="-34" r="1.3"/></g>
      </g>
    </g>
  </g>
</svg>
