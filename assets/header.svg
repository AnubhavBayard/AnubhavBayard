<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 430" width="1000" height="430" role="img">
  <style>
    .fg   { fill: #1b1b1b; }
    .red  { fill: #a4161a; }
    .star { fill: #a4161a; animation-name: twinkle; animation-iteration-count: infinite;
            animation-timing-function: ease-in-out; }
    .ember{ fill: #a4161a; animation-name: rise; animation-iteration-count: infinite;
            animation-timing-function: linear; opacity: 0; }
    .wave { fill: #a4161a; animation-name: roll; animation-iteration-count: infinite;
            animation-timing-function: linear; }
    .aurora { animation: sway 14s ease-in-out infinite; transform-origin: 50% 50%; }
    .glow { animation: pulse 4.5s ease-in-out infinite; }
    .ship { animation: rock 6s ease-in-out infinite; transform-origin: 50% 60%; }

    @keyframes twinkle { 0%,100% { opacity: .15 } 50% { opacity: .95 } }
    @keyframes rise {
      0%   { opacity: 0;  transform: translate(0, 0) }
      12%  { opacity: .85 }
      100% { opacity: 0;  transform: translate(var(--drift, 0px), -260px) }
    }
    @keyframes roll { from { transform: translateX(0) } to { transform: translateX(-1000px) } }
    @keyframes sway { 0%,100% { transform: translateX(-18px) scaleY(1) }
                      50%     { transform: translateX(18px)  scaleY(1.12) } }
    @keyframes pulse { 0%,100% { opacity: .82 } 50% { opacity: 1 } }
    @keyframes rock { 0%,100% { transform: rotate(-1.1deg) translateY(0) }
                      50%     { transform: rotate(1.1deg)  translateY(-3px) } }

    @media (prefers-color-scheme: dark) {
      .fg   { fill: #f2f2f2; }
      .red  { fill: #ff3b3b; }
      .star { fill: #ff8a8a; }
      .ember{ fill: #ff3b3b; }
      .wave { fill: #ff3b3b; }
    }
    @media (prefers-reduced-motion: reduce) {
      .star, .ember, .wave, .aurora, .glow, .ship { animation: none }
      .ember { opacity: .5 }
    }
  </style>

  <defs>
    <linearGradient id="aur" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#a4161a" stop-opacity="0"/>
      <stop offset="35%"  stop-color="#a4161a" stop-opacity=".42"/>
      <stop offset="65%"  stop-color="#6a040f" stop-opacity=".34"/>
      <stop offset="100%" stop-color="#a4161a" stop-opacity="0"/>
    </linearGradient>
  </defs>


