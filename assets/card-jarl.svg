<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 350" width="860" height="350" role="img" aria-label="The Jarl: Anubhav Bayard, Software Developer">
  <style>
    .bg   { fill: #faf8f6; stroke: #a4161a; stroke-opacity: .45; }
    .fg   { fill: #14181d; white-space: pre; }
    .red  { fill: #a4161a; }
    .ln   { stroke: #a4161a; }
    .glint{ animation: sweep 8s cubic-bezier(.4,0,.2,1) infinite; }
    @keyframes sweep { 0% { transform: translateX(-160px) } 55%,100% { transform: translateX(900px) } }
    @media (prefers-color-scheme: dark) {
      .bg  { fill: #121214; stroke: #ff3b3b; }
      .fg  { fill: #f2f2f2; }
      .red { fill: #ff3b3b; }
      .ln  { stroke: #ff3b3b; }
    }
    @media (prefers-reduced-motion: reduce) { .glint { animation: none; opacity: 0 } }
  </style>
  <defs>
    <linearGradient id="gl" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ff3b3b" stop-opacity="0"/>
      <stop offset="50%" stop-color="#ff3b3b" stop-opacity=".95"/>
      <stop offset="100%" stop-color="#ff3b3b" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="clip"><rect x="28" y="13" width="804" height="6"/></clipPath>
  </defs>
  <rect class="bg" x="1" y="1" width="858" height="348" rx="8" stroke-width="1.2"/>
  <rect class="red" x="1" y="16" width="3" height="40" rx="1.5"/>
  <line class="ln" x1="28" y1="16" x2="832" y2="16" stroke-width="1" opacity=".3"/>
  <g clip-path="url(#clip)"><rect class="glint" x="0" y="14" width="160" height="4" fill="url(#gl)" rx="2"/></g>
  <g font-family="'JetBrains Mono','DejaVu Sans Mono','Fira Code',Consolas,monospace" font-size="12.5">
    <text class="fg" x="140.3" y="40" xml:space="preserve">        .-&quot;&quot;-.        NAME  ...  Anubhav Bayard</text>
    <text class="fg" x="140.3" y="58" xml:space="preserve">       / .--. \       TITLE ...  Software Developer · Open Source Raider</text>
    <text class="fg" x="140.3" y="76" xml:space="preserve">      / /    \ \      HALL  ...  The Terminal</text>
    <text class="fg" x="140.3" y="94" xml:space="preserve">      | |    | |      OATH  ...  Do the work. Do it well. Never stop growing.</text>
    <text class="fg" x="140.3" y="112" xml:space="preserve">      | |.-&quot;&quot;-.|      RUNE  ...  ᚨ  ansuz — the word, the craft, the signal</text>
    <text class="fg" x="140.3" y="130" xml:space="preserve">     ///`.::::.`\     FACT  ...  An outstanding introvert</text>
    <text class="fg" x="140.3" y="148" xml:space="preserve">    ||| ::/  \:: ;</text>
    <text class="fg" x="140.3" y="166" xml:space="preserve">    ||; ::\__/:: ;    Studying system design fundamentals, so every</text>
    <text class="fg" x="140.3" y="184" xml:space="preserve">     \\\ &#x27;::::&#x27; /     trade-off at scale is a choice, never an accident.</text>
    <text class="fg" x="140.3" y="202" xml:space="preserve">      `=&#x27;:-..-&#x27;`</text>
    <text class="fg" x="140.3" y="238" xml:space="preserve">ᚱ   SAILING TOWARD  ...  scalable web systems, clean architecture</text>
    <text class="fg" x="140.3" y="256" xml:space="preserve">ᚲ   FORGING         ...  Web Development, backend craft, honest APIs</text>
    <text class="fg" x="140.3" y="274" xml:space="preserve">ᛗ   SEEKING CREW    ...  open source, ambitious web builds</text>
    <text class="fg" x="140.3" y="292" xml:space="preserve">ᛊ   ASK ME OF       ...  my life :)</text>
    <text class="fg" x="140.3" y="310" xml:space="preserve">ᚹ   SEND WORD       ...  letsmailanu.10@gmail.com</text>
  </g>
</svg>
