<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 16" width="560" height="16" role="img">
  <style>
    .fg   { fill: #14181d; }
    .red  { fill: #a4161a; }
    .ln   { stroke: #a4161a; }
    .rune { animation: breathe 6s ease-in-out infinite; }
    .rune2{ animation: breathe 6s ease-in-out infinite; animation-delay: 3s; }
    .glint{ animation: sweep 7s cubic-bezier(.4,0,.2,1) infinite; }
    @keyframes breathe { 0%,100% { opacity: .45 } 50% { opacity: 1 } }
    @keyframes sweep {
      0%    { transform: translateX(-140px) }
      55%,100% { transform: translateX(600px) }
    }
    @media (prefers-color-scheme: dark) {
      .fg  { fill: #f2f2f2; }
      .red { fill: #ff3b3b; }
      .ln  { stroke: #ff3b3b; }
    }
    @media (prefers-reduced-motion: reduce) {
      .rune, .rune2, .glint { animation: none }
      .glint { opacity: 0 }
    }
  </style>
  <defs>
    <linearGradient id="gl" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#ff3b3b" stop-opacity="0"/>
      <stop offset="50%"  stop-color="#ff3b3b" stop-opacity=".95"/>
      <stop offset="100%" stop-color="#ff3b3b" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <g font-family="'JetBrains Mono','Fira Code','Cascadia Mono',Consolas,'DejaVu Sans Mono',monospace">

    <text class="red rune" x="12" y="13" font-size="13" text-anchor="middle">ᚦ</text>
    <text class="red rune2" x="548" y="13" font-size="13" text-anchor="middle">ᚦ</text>
    <line class="ln" x1="30" y1="9" x2="530" y2="9" stroke-width="1.1" opacity=".3"/>
    <g clip-path="url(#clipr)">
      <rect class="glint" x="0" y="6.6" width="140" height="5" fill="url(#gl)" rx="2.5"/>
    </g>
    <clipPath id="clipr"><rect x="30" y="4" width="500" height="11"/></clipPath>

  </g>
</svg>
