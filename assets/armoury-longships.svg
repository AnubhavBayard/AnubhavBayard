<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 140" width="860" height="140" role="img" aria-label="LONGSHIPS: REACT, NEXT.JS, VITE, TAILWIND, IONIC, CAPACITOR, GSAP">
  <style>
    .bg   { fill: #faf8f6; stroke: #a4161a; stroke-opacity: .45; }
    .fg   { fill: #14181d; }
    .red  { fill: #a4161a; }
    .ln   { stroke: #a4161a; }
    .chip { fill: #a4161a; fill-opacity: .04; stroke: #a4161a; stroke-opacity: .55; }
    .rune { animation: breathe 6s ease-in-out infinite; }
    .glint{ animation: sweep 8s cubic-bezier(.4,0,.2,1) infinite; }
    @keyframes breathe { 0%,100% { opacity: .45 } 50% { opacity: 1 } }
    @keyframes sweep { 0% { transform: translateX(-160px) } 55%,100% { transform: translateX(900px) } }
    @media (prefers-color-scheme: dark) {
      .bg   { fill: #121214; stroke: #ff3b3b; }
      .fg   { fill: #f2f2f2; }
      .red  { fill: #ff3b3b; }
      .ln   { stroke: #ff3b3b; }
      .chip { fill: #ff3b3b; fill-opacity: .06; stroke: #ff3b3b; }
    }
    @media (prefers-reduced-motion: reduce) {
      .rune, .glint { animation: none }
      .glint { opacity: 0 }
    }
  </style>
